# whatsapp-with-dashboard — CONTAINER MODE.
#
# The app's MySQL store lives on the SHARED master-compose-ai stack
# (/home/ardi/devel/projects/master-compose-ai). That stack is NOT started by
# this file and NOT owned by this repo.
#
#   host mode       make run            -> 127.0.0.1:5306      (published port)
#   container mode  make up             -> mysqldb-master:3306 (container DNS)
#
# 127.0.0.1 inside this container is the CONTAINER's loopback, not the host's,
# so the published 5306 is unreachable from in here. Joining the shared network
# and using the service name is both shorter and the house pattern.
#
# The .env in this repo is written for HOST MODE. The `environment:` block below
# overrides the host-mode values in-container — compose gives `environment:`
# precedence over `env_file:`, and that seam is what lets ONE .env serve both.
#
# NEVER run `docker compose down` (let alone `down -v`) inside master-compose-ai:
# that stack holds other products' data.

name: whatsapp-with-dashboard

networks:
  infra:
    # Owned by the master-compose-ai stack, NOT created here. If this errors with
    # "network declared as external, but could not be found", that stack is down —
    # start it there; never `docker network create` it here.
    external: true
    name: master-compose-ai-net

volumes:
  wsm-sqlite:
    # whatsmeow's crypto/device store. THIS IS CRYPTOGRAPHIC IDENTITY MATERIAL:
    # losing it means re-pairing the handset by QR, in person. Treat it like a
    # credential and never `docker compose down -v` this stack casually.
    name: whatsapp-with-dashboard-sqlite
  waxum-sessions:
    # waxum's registry lives in MySQL, but under WHATSAPP_STORAGE_PATH it also
    # keeps a per-session SQLite whatsapp.db plus an instance-lock file — the
    # SAME class of cryptographic identity material as wsm-sqlite above. Never
    # `docker compose down -v` this stack casually. And unlike the app, waxum
    # cannot be replicated even READ-only: the instance lock forbids two
    # processes pointed at one storage dir, so there is no rolling-restart or
    # scale-out story here either.
    name: whatsapp-with-dashboard-waxum

services:
  app:
    build:
      context: .
    image: whatsapp-with-dashboard:local
    restart: unless-stopped

    # HARD SINGLETON — see the Dockerfile. Two replicas against one store make
    # WhatsApp log the session out. Do not add deploy.replicas, do not roll this.

    env_file:
      - .env
    environment:
      # --- container-mode overrides (these win over env_file) ---
      WSM_MYSQL_HOST: mysqldb-master
      WSM_MYSQL_PORT: "3306"
      # Neutralise any host-mode WSM_APP_DSN left in .env: internal/config lets
      # WSM_APP_DSN win VERBATIM over the WSM_MYSQL_* parts, and envOr() treats
      # "" as unset — so an empty string here restores the composed DSN above.
      WSM_APP_DSN: ""
      # The SQLite store on the named volume, not the repo working directory.
      WSM_DB_PATH: /data/wsm.db
      WSM_ADDR: ":8800"
      # waxum is reachable only from inside this compose network — see the
      # waxum service below for why it publishes no host port.
      WSM_WAXUM_URL: http://waxum:3451
      WSM_WAXUM_TOKEN: ${WAXUM_TOKEN}

    volumes:
      - wsm-sqlite:/data

    ports:
      # LOOPBACK BY DEFAULT. This is an admin surface with a WhatsApp identity
      # behind it; do not publish it on the LAN without a reverse proxy and TLS.
      #
      # WSM_BIND_ADDR is the deliberate opt-out for a host that DOES sit behind
      # one. Set it to the single interface the proxy reaches this box on --
      # a WireGuard address, say -- and never to 0.0.0.0, which would hand the
      # dashboard to every network the host is attached to. Pair it with
      # WA_COOKIE_SECURE=true and WSM_TRUSTED_PROXIES; see .env.example.
      - "${WSM_BIND_ADDR:-127.0.0.1}:${WSM_EXPOSED_PORT:-8800}:8800"

    networks: [infra]

    # PLAIN depends_on, not `condition: service_healthy`. The app must be able
    # to boot with waxum down or still starting — internal/wa's status poller
    # (manager_boot.go) converges once waxum answers, the same way it already
    # tolerates whatsmeow reconnecting in the background. Gating startup on
    # waxum's health would make one container's boot order dictate the
    # other's, which is exactly the coupling the two-process split was meant
    # to avoid.
    depends_on: [waxum]

    # whatsmeow needs time to disconnect its websockets cleanly on SIGTERM.
    # cmd/app tears down as server.Shutdown(5s) -> manager.Close() (joins every
    # send pump) -> appDB.Close() -> the SQLite store LAST. 15s leaves headroom
    # over that 5s budget; a SIGKILL mid-teardown risks the crypto store.
    stop_grace_period: 15s

    # No healthcheck: distroless/static has nothing to exec. GET /api/v1/health
    # is public — probe it from the host or a reverse proxy:
    #   curl -sf http://127.0.0.1:8800/api/v1/health

  # waxum: the Rust REST gateway that WSM_WA_BACKEND=waxum drives instead of
  # the in-process whatsmeow library (internal/wa/backend_waxum.go). Reachable
  # ONLY at http://waxum:3451 on this compose network — see the deliberate
  # absence of a `ports:` block below.
  waxum:
    image: fdciabdul/waxum:${WAXUM_TAG}
    # Pinned via .env.example's WAXUM_TAG=0.12.2 (current as of this writing,
    # matches waxum's own Cargo.toml, multi-arch amd64/arm64), and never
    # `latest`: this is a third-party image, and an unpinned tag is an
    # unreviewed upgrade landing on every `docker compose pull`. Bump
    # WAXUM_TAG deliberately when there is a reason to.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${WAXUM_MYSQL_USER}:${WAXUM_MYSQL_PASSWORD}@mysqldb-master:3306/${WAXUM_MYSQL_DATABASE}
      SUPERADMIN_TOKEN: ${WAXUM_TOKEN:?waxum needs WAXUM_TOKEN in .env}
      WHATSAPP_STORAGE_PATH: /data/whatsapp_sessions
      # waxum's tower_governor rate limiter defaults to a burst of only ~3
      # requests per peer IP. Live incident: WSM's own pairing/status
      # pollers (internal/wa's statusPump + pairPump, one process, one
      # source IP on this network) alone burst straight through that —
      # 60 rapid GET /api/v1/sessions measured 57 x HTTP 429 to 3 x HTTP
      # 200, from the app container's OWN network namespace (see
      # CLAUDE.md's waxum rate-limit hazard note for why that measurement
      # location matters).
      #
      # RATE_LIMIT_PER_SECOND is NOT a requests-per-second rate, despite the
      # name: tower_governor's `per_second()` sets the REPLENISH INTERVAL, in
      # seconds, for ONE token — waxum's own default of 20 means one token
      # every 20 seconds. A BIGGER number here makes the limiter TIGHTER, not
      # looser; a value near 1 (one token/sec) is the generous setting.
      # waxum is reachable ONLY on this compose network (no `ports:` block
      # above) and only WSM talks to it, so a generous, bounded allowance is
      # safe. WSM's own client (internal/waxum) also carries a process-wide
      # token bucket and retries a 429 with backoff as defense-in-depth, but
      # that is a second line of defense, not a substitute for waxum itself
      # having room to serve this app's normal traffic without throttling it.
      RATE_LIMIT_PER_SECOND: "1"     # replenish interval in SECONDS -> 1 token/sec
      RATE_LIMIT_BURST: "200"
    volumes:
      - waxum-sessions:/data

    # NO ports: block, deliberately. The app reaches waxum at
    # http://waxum:3451 over the compose network above; nothing else may
    # reach it. waxum's SUPERADMIN_TOKEN is a root credential for every
    # WhatsApp session it holds, and publishing this on the host or the LAN
    # would put that credential's blast radius one network hop away instead
    # of zero.

    networks: [infra]

    healthcheck:
      # The image ships curl.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3451/health"]

    stop_grace_period: 15s

  # One-shot goose runner, ON the shared network so it resolves mysqldb-master
  # the same way the app does. Opt-in: the normal path is `make migrate-up` on
  # the host. This exists for hosts with no Go toolchain.
  #
  #   docker compose --profile migrate run --rm migrate up
  #   docker compose --profile migrate run --rm migrate status
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile.migrate
    env_file:
      - .env
    environment:
      WSM_MYSQL_HOST: mysqldb-master
      WSM_MYSQL_PORT: "3306"
    networks: [infra]
    restart: "no"
