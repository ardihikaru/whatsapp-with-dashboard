# whatsapp-with-dashboard — REMOTE-DB MODE. Overlay, never used alone:
#
#   docker compose -f docker-compose.yml -f docker-compose.remote-db.yml up -d
#   make up-remote-db
#
# The base file assumes the app runs on the SAME host as the shared
# master-compose-ai stack: it joins that stack's network and dials MySQL by its
# container DNS name `mysqldb-master`. Neither exists on a host that runs only
# the app, so compose there fails at `up` with "network declared as external,
# but could not be found" — the network is not missing, it lives on another box.
#
# This overlay drops both assumptions. The app joins compose's own default
# bridge and reaches MySQL over the private network at the address the .env
# already names, so ONE .env keeps serving host mode, container mode and this.
#
# `!reset` (compose >= 2.24) deletes a key the base set rather than merging into
# it. Plain `networks: []` would NOT do this: compose merges service networks,
# so `infra` would survive and the external lookup would still run.

name: whatsapp-with-dashboard

networks:
  # Undeclare the external network entirely. Leaving the declaration behind is
  # not harmless: compose resolves every declared external network at `up`,
  # whether or not a service still attaches to it.
  infra: !reset null

services:
  app:
    networks: !reset null
    environment:
      # These win over the base file's container-DNS values. `:?` fails loudly
      # at `config` time instead of letting the app boot and hang on a dial to a
      # name that does not resolve here.
      WSM_MYSQL_HOST: ${WSM_MYSQL_HOST:?remote-db mode needs WSM_MYSQL_HOST in .env}
      WSM_MYSQL_PORT: ${WSM_MYSQL_PORT:?remote-db mode needs WSM_MYSQL_PORT in .env}

  migrate:
    networks: !reset null
    environment:
      WSM_MYSQL_HOST: ${WSM_MYSQL_HOST:?remote-db mode needs WSM_MYSQL_HOST in .env}
      WSM_MYSQL_PORT: ${WSM_MYSQL_PORT:?remote-db mode needs WSM_MYSQL_PORT in .env}

  # waxum doesn't read WSM_MYSQL_*; it takes one DSN in DATABASE_URL. Same
  # repoint, spelled the way waxum actually consumes it.
  #
  # NATS_URL gets the same repoint for the same reason: the base file's
  # nats-master resolves only on master-compose-ai-net, which this overlay
  # has just reset above. Only the ADDRESS is redeclared here — compose
  # merges a service's `environment:` map key-by-key across `-f` files, so
  # NATS_TOKEN and the NATS_*_STREAM/NATS_*_MAX_AGE_DAYS vars carry over from
  # the base file untouched, the same reason SUPERADMIN_TOKEN and
  # RATE_LIMIT_* are not repeated here either.
  waxum:
    networks: !reset null
    environment:
      DATABASE_URL: mysql://${WAXUM_MYSQL_USER}:${WAXUM_MYSQL_PASSWORD}@${WSM_MYSQL_HOST:?remote-db mode needs WSM_MYSQL_HOST in .env}:${WSM_MYSQL_PORT:?remote-db mode needs WSM_MYSQL_PORT in .env}/${WAXUM_MYSQL_DATABASE}
      NATS_URL: nats://${NATS_HOST:?remote-db mode needs NATS_HOST in .env}:${NATS_PORT:?remote-db mode needs NATS_PORT in .env}
