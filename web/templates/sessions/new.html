{{define "content"}}
<div class="page-heading">
  <h4>New WhatsApp Session</h4>
</div>
<div class="card form-card">
  <div id="form-error"></div>
  <form hx-post="{{u "/sessions"}}" hx-target="#form-error" hx-swap="innerHTML"
        action="{{u "/sessions"}}" method="post" novalidate>
    <label class="textfield">
      <span class="textfield-label">Session name</span>
      <input type="text" name="name" placeholder="e.g. Taskmgr notifications" required autofocus>
    </label>
    <label class="textfield">
      <span class="textfield-label">WhatsApp phone number (international format)</span>
      <input type="tel" name="phone" placeholder="+62 812-0000-0000" required>
    </label>
    <label class="checkfield">
      <input type="checkbox" name="is_master" value="true">
      <span>Master session (excluded from automatic routing)</span>
    </label>
    <label class="textfield">
      <span class="textfield-label">Routing group (optional)</span>
      <!-- Same open-set control as sessions/ops.html's editor — see that
           template's comment for why <input list>+<datalist> and not a
           <select>. -->
      <input list="wa-group-codes" name="group_code" maxlength="32" placeholder="none — ungrouped" autocomplete="off">
      <datalist id="wa-group-codes">
        {{range .GroupCodes}}<option value="{{.}}">{{end}}
      </datalist>
      <small class="muted">Assigning a group takes this session OUT of default automatic routing —
        it becomes reachable only by a request naming this same group code.</small>
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Create &amp; pair</button>
      <a class="btn btn-outline" href="{{u "/sessions"}}">Cancel</a>
    </div>
  </form>
</div>
{{end}}
