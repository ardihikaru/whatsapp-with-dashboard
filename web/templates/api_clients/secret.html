{{/* One-time secret reveal. Dot is the secret string. It is never retrievable
     again, so the copy affordance and the warning are not optional. */}}
{{define "api_client_secret"}}
<div class="alert alert-success">
  <div class="secret-box">
    <strong>Secret baru:</strong>
    <span class="mono" id="new-secret">{{.}}</span>
    <button class="btn btn-outline" type="button"
            onclick="navigator.clipboard.writeText(document.getElementById('new-secret').textContent.trim());this.textContent='Tersalin';">Salin</button>
  </div>
  <p class="muted" style="margin-top:8px">
    Simpan sekarang — secret ini hanya ditampilkan sekali dan tidak dapat dilihat lagi.
  </p>
</div>
{{end}}
