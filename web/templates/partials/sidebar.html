{{define "sidebar"}}
<aside class="sidebar" id="app-sidebar" aria-label="Menu utama">
  <div class="sidebar-logo">
    <img src="{{u "/static/img/logo.svg"}}" alt="Clino WhatsApp" width="32" height="32">
    <span>Clino&nbsp;· WhatsApp</span>
  </div>
  {{range .Nav}}
  <div class="nav-subheader">{{.Subheader}}</div>
  <nav class="nav">
    {{range .Items}}
    <a class="nav-item{{if .Active}} active{{end}}" href="{{.Path}}">
      {{if .Icon}}<span class="nav-icon">{{.Icon}}</span>{{else}}<span class="nav-dot" aria-hidden="true"></span>{{end}}
      <span class="nav-text">{{.Title}}</span>
    </a>
    {{end}}
  </nav>
  {{end}}
  {{if .Username}}
  <div class="nav-user">Masuk sebagai <strong>{{.Username}}</strong></div>
  {{end}}
  {{if .PlatformLink.Path}}
  <nav class="nav nav-footer">
    <a class="nav-item" href="{{.PlatformLink.Path}}">
      <span class="nav-icon">{{.PlatformLink.Icon}}</span>
      <span class="nav-text">{{.PlatformLink.Title}}</span>
    </a>
  </nav>
  {{end}}
</aside>
{{end}}
