  /api/v1/sessions/{id}/webhooks:
    get:
      summary: List webhooks registered for this session
      description: >
        Responses NEVER include the signing secret's value — only
        has_secret (bool). waxum-only.
      operationId: listSessionWebhooks
      tags: [webhooks]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Registered webhooks.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Webhook'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Backend has no webhook administration support (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      summary: Register a webhook subscription for this session
      description: >
        `events` is validated against waxum's known event-name set before the
        request ever reaches waxum — an unknown value 400s naming it. A
        callback URL resolving to loopback/RFC1918/ULA/CGNAT/link-local is
        refused with 422 naming that as the cause (waxum's SSRF guard, no env
        escape hatch — most operator-run receivers ARE on a private network,
        so this is the single most likely mistake here). A duplicate URL
        answers 409. The response NEVER includes the secret's value.
      operationId: registerSessionWebhook
      tags: [webhooks]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: {type: string}
                events:
                  type: array
                  items:
                    type: string
                    enum: [all, message, receipt, presence, chat_presence, group_update,
                           joined_group, qr_code, pair_code, connected, disconnected,
                           logged_out, account_locked, picture_update, user_about_update,
                           push_name_update, contact_update, device_list_update, pin_update,
                           mute_update, archive_update, mark_chat_as_read, undecryptable_message,
                           client_outdated, offline_sync_preview, offline_sync_completed,
                           scheduled_sent, scheduled_failed, blast_progress, blast_completed,
                           call_log_sync, stream_error, enc_decrypt_failed]
                secret: {type: string, description: 'HMAC signing key; never echoed back'}
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        '400':
          description: url missing, events missing, or an unknown event name (named in the message).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: A webhook with this URL is already registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: waxum's SSRF guard refused the callback URL (message names the cause).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Backend has no webhook administration support (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/webhooks/{webhookID}:
    delete:
      summary: Unregister a webhook subscription
      operationId: deleteSessionWebhook
      tags: [webhooks]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: webhookID, in: path, required: true, schema: {type: string}}
      responses:
        '204':
          description: Unregistered.
        '404':
          description: Unknown session or webhook.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Backend has no webhook administration support (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/webhooks/{webhookID}/enable:
    post:
      summary: Re-enable a webhook whose delivery circuit was opened after repeated failures
      operationId: enableSessionWebhook
      tags: [webhooks]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: webhookID, in: path, required: true, schema: {type: string}}
      responses:
        '204':
          description: Re-enabled.
        '404':
          description: Unknown session or webhook.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Backend has no webhook administration support (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/webhooks/dlq:
    get:
      summary: List this session's dead-lettered webhook deliveries
      operationId: listSessionWebhookDLQ
      tags: [webhooks]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Dead-lettered deliveries.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DLQEntry'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Backend has no webhook administration support (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/webhooks/dlq/{entryID}/replay:
    post:
      summary: Retry one dead-lettered webhook delivery
      operationId: replaySessionWebhookDLQEntry
      tags: [webhooks]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: entryID, in: path, required: true, schema: {type: string}}
      responses:
        '204':
          description: Replay requested.
        '404':
          description: Unknown session or DLQ entry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Backend has no webhook administration support (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/webhooks/reenable-all:
    post:
      summary: Re-enable every open webhook circuit across every session (fleet-level)
      description: >
        Deliberately NOT scoped under /sessions/{id} — this re-enables webhook
        delivery for every session on the waxum instance at once.
      operationId: reenableAllWebhooks
      tags: [webhooks]
      security: [{bearerAuth: []}, {basicAuth: []}]
      responses:
        '204':
          description: Re-enabled fleet-wide.
        '501':
          description: Backend has no webhook administration support (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/v1/gateway/health:
    get:
      summary: Backend gateway process health probe (authenticated)
      description: >
        NOT the same route as the unauthenticated /api/v1/health container
        healthcheck — this one calls the backend inline and is deliberately
        excluded from the liveness-probe path. Gains a cached backend field
        in a future phase.
      operationId: getGatewayHealth
      tags: [system]
      security: [{bearerAuth: []}, {basicAuth: []}]
      responses:
        '200':
          description: Gateway reachable and healthy.
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string}}}
        '501':
          description: Backend has no separate gateway process to probe (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/inbound:
    get:
      summary: Fleet-level read of customer replies, oldest first
      description: >
        A read endpoint, not a webhook: this gateway is shared by several
        products, and pushing would make it a fan-out router holding a URL,
        a secret, a retry policy and a DLQ per subscriber. Results are
        always oldest first — a consumer resolving a reply against the open
        question it answers must not let a later message close a question
        an earlier one already answered. since is required so a caller that
        forgot it fails loudly instead of silently reading the whole table.
      operationId: listInbound
      tags: [inbound]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - name: since
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: RFC3339 timestamp; only arrivals at or after this instant are returned.
        - name: limit
          in: query
          schema: {type: integer, default: 200, maximum: 500}
      responses:
        '200':
          description: Arrivals at or after since, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboundMessage'
        '400':
          description: since missing or not valid RFC3339.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Inbound log unavailable on this deployment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/contacts/check:
    post:
      summary: Check whether numbers are registered on WhatsApp, using automatic session routing
      description: >
        waxum-only (wa.ContactDirectory) — 501 on a whatsmeow backend. Every
        input is normalised individually; an unparseable entry becomes its
        own "invalid" row rather than failing the whole request. Capped at
        100 numbers per request (after blank lines are dropped) — bulk
        usync against a paired device identity that has no second copy
        anywhere is a ban vector.
      operationId: checkContactsAuto
      tags: [contacts]
      security: [{bearerAuth: []}, {basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phones]
              properties:
                phones:
                  type: array
                  items: {type: string}
                  description: 'International format accepted with human formatting, e.g. "+62 812-0000-0000" or "6289900000000"'
                group_code: {type: string, maxLength: 32, pattern: '^[a-z0-9_-]*$', description: 'Automatic routing only. Narrows selection to sessions carrying this SAME group_code; omitted or "" selects among sessions with NO group code. Exact match in both directions, no fallback between scopes. This endpoint does not accept master_only.'}
                allow_master: {type: boolean, description: 'Automatic routing only; ignored when a session id is in the path. Opts into a master-flagged session for this one request.'}
      responses:
        '200':
          description: One verdict per input line, in input order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactsCheckResponse'}
        '400':
          description: Malformed JSON, missing/empty phones, or more than 100 numbers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >
            No connected session exists to auto-route through, IN THE SCOPE THE
            REQUEST ASKED FOR. The body names the actual cause rather than the
            symptom, because a scoped send can fail while the gateway is
            perfectly healthy: if the only connected session(s) are flagged
            is_master it says so (see PUT /api/v1/sessions/{id}/master) and
            suggests allow_master; with a group_code it distinguishes "nothing
            carries that code" (likely a typo) from "that group is offline
            while other sessions are connected" from "the group is up but has
            no master". Every group-scoped body ends with the same escape
            hatch - omit group_code to route through any connected session.
            Note GET /api/v1/health counts sessions across ALL scopes, so
            connected > 0 and a 409 here are not a contradiction.
            Note GET /api/v1/health and Manager.Counts() still count a master
            session as connected, so an operator can legitimately see
            connected: 1 here and still get this 409.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Active backend has no ContactDirectory support (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Backend is rate-limiting this request; retry shortly.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/contacts/check:
    post:
      summary: Check whether numbers are registered on WhatsApp, through this session
      description: >
        Same behaviour as POST /api/v1/contacts/check, against an explicit
        session id rather than automatic routing. Does not require a live
        socket check of its own beyond what the backend itself enforces.
      operationId: checkContacts
      tags: [contacts]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phones]
              properties:
                phones:
                  type: array
                  items: {type: string}
                  description: 'International format accepted with human formatting, e.g. "+62 812-0000-0000" or "6289900000000"'
      responses:
        '200':
          description: One verdict per input line, in input order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactsCheckResponse'}
        '400':
          description: Malformed JSON, missing/empty phones, or more than 100 numbers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Active backend has no ContactDirectory support (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Backend is rate-limiting this request; retry shortly.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Token from POST /api/v1/auth/login. Verified with a single SHA-256 and an
        indexed lookup, so it is the cheaper option for a chatty caller. Can be
        revoked individually and carries an expiry.
    basicAuth:
      type: http
      scheme: basic
      description: >
        The API client's login_id and secret sent directly on every request, as
        an alternative to exchanging them for a token. No token is minted, so
        there is nothing to revoke individually: revoking Basic access means
        deactivating the client or rotating its secret. Verified against bcrypt,
        with successful verifications cached in memory for 60 seconds; failed
        attempts are rate-limited per IP. Requires TLS in production, since the
        secret travels on every request.
  schemas:
    LoginRequest:
      type: object
      required: [login_id, secret]
      properties:
        login_id:
          type: string
        secret:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
    Health:
      type: object
      properties:
        status:
          type: string
        sessions:
          type: integer
        connected:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
    Session:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        phone: {type: string, description: 'Normalized digits'}
        jid: {type: string, description: 'Own WhatsApp JID; empty until paired'}
        state: {type: string, enum: [new, pairing, connected, disconnected, logged_out]}
        connected: {type: boolean, description: 'Live socket check, not just state'}
        queue_len: {type: integer}
        is_master: {type: boolean, description: 'Routing-exclusion flag; still connected and directly sendable, just skipped by automatic selection unless allow_master is set. See PUT /api/v1/sessions/{id}/master.'}
        group_code: {type: string, description: 'Routing scope; "" means ungrouped. Automatic selection only matches sessions with the SAME group_code as the request. See PUT /api/v1/sessions/{id}/group-code.'}
    SendResponse:
      type: object
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, sent, failed]}
        wa_message_id: {type: string}
        error: {type: string}
        session_id: {type: string}
        session_name: {type: string}
        session_group_code: {type: string, description: 'Routing scope of the session that actually sent. ALWAYS present; "" means the session is ungrouped. An absent key would be indistinguishable from an older gateway that never had group_code at all.'}
        session_is_master: {type: boolean, description: 'Whether the session that actually sent is master-flagged.'}
        routing: {type: string, enum: [auto, master_only, group, group_master_only, explicit], description: 'Which routing decision produced this session. "explicit" is reported by the /sessions/{id}/... routes, which name their own session and ignore group_code/master_only/allow_master entirely.'}
    Message:
      type: object
      properties:
        id: {type: string}
        to_phone: {type: string}
        status: {type: string, enum: [queued, sent, failed]}
        wa_message_id: {type: string}
        error: {type: string}
        attempts: {type: integer}
        created_at: {type: string, format: date-time}
        sent_at: {type: string, format: date-time, nullable: true}
    MediaSendResponse:
      type: object
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, sent, failed]}
        wa_message_id: {type: string}
        error: {type: string}
        session_id: {type: string}
        session_name: {type: string}
        session_group_code: {type: string, description: 'Routing scope of the session that actually sent. ALWAYS present; "" means ungrouped.'}
        session_is_master: {type: boolean, description: 'Whether the session that actually sent is master-flagged.'}
        routing: {type: string, enum: [auto, master_only, group, group_master_only, explicit], description: 'Which routing decision produced this session.'}
        kind: {type: string, enum: [image, video, audio, document]}
        filename: {type: string}
    MediaDescriptor:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [image, video, audio, document]}
        url: {type: string}
        direct_path: {type: string}
        media_key: {type: string}
        file_sha256: {type: string}
        file_enc_sha256: {type: string}
        file_length: {type: integer, format: int64}
        media_type: {type: string}
        mimetype: {type: string}
    MediaDownloadResponse:
      type: object
      properties:
        mimetype: {type: string}
        size: {type: integer}
        data_base64: {type: string, description: 'Decrypted bytes, base64-encoded'}
    InboundMessage:
      type: object
      description: >
        One customer reply from GET /api/v1/inbound. client_ref/tenant_ref
        are the tier stamp: copied from the most recent outbound message to
        the same phone within a bounded window. A consumer MUST ignore any
        row whose client_ref it cannot resolve locally — one gateway serves
        several products and environments, and an empty value means
        un-attributed, which is the safe outcome, never a guess.
      properties:
        id: {type: string, description: 'The WhatsApp message id; the natural idempotency key.'}
        from_phone: {type: string, description: 'Normalized digits.'}
        body: {type: string}
        received_at: {type: string, format: date-time}
        client_ref: {type: string, description: 'Tier stamp; empty means no product may claim this message.'}
        tenant_ref: {type: string, description: 'Tier stamp; empty means no product may claim this message.'}
    Call:
      type: object
      properties:
        id: {type: string}
        to_phone: {type: string}
        kind: {type: string, enum: [tts, play]}
        text: {type: string}
        voice: {type: string}
        audio_url: {type: string}
        call_id: {type: string}
        recording_url: {type: string}
        status: {type: string, enum: [placing, placed, failed, terminated]}
        error: {type: string}
        created_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time, nullable: true}
    CallPlaceResponse:
      type: object
      properties:
        id: {type: string}
        status: {type: string, enum: [placed]}
        call_id: {type: string}
        recording_url: {type: string}
    AutoReconnect:
      type: object
      properties:
        enabled: {type: boolean}
        error_count: {type: integer}
    OperationsSnapshot:
      type: object
      properties:
        paused: {type: boolean}
        auto_reconnect: {$ref: '#/components/schemas/AutoReconnect'}
        history_sync:
          type: object
          properties:
            skip: {type: boolean}
    AppStateResyncResult:
      type: object
      properties:
        synced: {type: array, items: {type: string}}
        fatal: {type: array, items: {type: string}}
        retryable: {type: array, items: {type: string}}
        skipped: {type: array, items: {type: string}}
        all_synced: {type: boolean}
    SpamReportResult:
      type: object
      properties:
        success: {type: boolean}
        report_id: {type: string, nullable: true}
    TCToken:
      type: object
      properties:
        jid: {type: string}
        timestamp: {type: integer, format: int64}
    TCTokenInfo:
      type: object
      properties:
        jid: {type: string}
        token_timestamp: {type: integer, format: int64}
        sender_timestamp: {type: integer, format: int64, nullable: true}
        found: {type: boolean}
    Webhook:
      type: object
      description: >
        The signing secret's VALUE is never present here — see has_secret.
      properties:
        id: {type: string}
        url: {type: string}
        events: {type: array, items: {type: string}}
        enabled: {type: boolean}
        has_secret: {type: boolean}
    DLQEntry:
      type: object
      properties:
        id: {type: string}
        session_id: {type: string}
        webhook_url: {type: string}
        event: {type: string}
        payload: {type: string}
        last_error: {type: string}
        attempts: {type: integer}
        failed_at: {type: integer, format: int64}
    ContactVerdict:
      type: object
      description: >
        One checked line, in the same order it was submitted. "unknown"
        means the backend simply did not answer about this number — it is
        NOT evidence the number is unregistered, and is reported distinctly
        rather than guessed.
      properties:
        input: {type: string, description: 'Exactly what was submitted for this line, including anything rejected as invalid'}
        phone: {type: string, description: 'Normalised/canonicalised digits; omitted when input is invalid'}
        jid: {type: string, description: 'WhatsApp JID, present only alongside status=registered'}
        status: {type: string, enum: [registered, not_registered, invalid, unknown]}
        error: {type: string, description: 'Set only when status=invalid'}
    ContactsCheckResponse:
      type: object
      properties:
        session:
          type: object
          properties:
            id: {type: string}
            name: {type: string}
        results:
          type: array
          items: {$ref: '#/components/schemas/ContactVerdict'}
