openapi: 3.0.3
info:
  title: WhatsApp Session Management API
  description: >
    Go + HTMX gateway app managing WhatsApp device sessions (pair, activate,
    deactivate) and sending plain-text messages through them. JSON API callers
    must use an API-client login id and secret at /api/v1/auth/login, then send
    the returned token as `Authorization: Bearer <token>`. Browser cookies are
    only for the admin pages. Sends are queued per session (cap 100),
    rate-limited (1 msg/s, burst 3) and retried up to 3 times; delivery is
    at-least-once when a send times out.

    Media, voice calls, session-administration operations (pause/resume,
    auto-reconnect, history-sync, appstate resync, spam reporting,
    trust-conversation tokens) and webhook administration are all
    waxum-backed only: every one of those routes answers 501 on a
    whatsmeow-backed deployment (WSM_WA_BACKEND=whatsmeow). Voice calls
    additionally answer 501 unless WSM_CALLS_ENABLED=true, independent of
    the backend.
  version: 0.4.0
servers:
  - url: http://localhost:8800
paths:
  /api/v1/auth/login:
    post:
      summary: Log in as an API client
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; bearer token returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >
            Invalid credentials, an inactive API client, or a client whose
            access period has ended (its expiry was configured as an absolute
            date that is now in the past).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      summary: Revoke the bearer token used for this request
      description: >
        Bearer only. A client authenticated with HTTP Basic minted no token and
        has nothing to revoke, so it receives 400; cut off a Basic client by
        deactivating it or rotating its secret instead.
      operationId: logout
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Token revoked.
        '400':
          description: The request was authenticated with Basic, which mints no token.
  /api/v1/health:
    get:
      summary: Process health (public)
      operationId: health
      tags: [system]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/stats:
    get:
      summary: Dashboard KPI values
      operationId: stats
      tags: [dashboard]
      security:
        - bearerAuth: []
        - basicAuth: []
      responses:
        '200':
          description: KPI label -> formatted value.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/sessions:
    get:
      summary: List sessions (live snapshots)
      operationId: listSessions
      tags: [sessions]
      security: [{bearerAuth: []}, {basicAuth: []}]
      responses:
        '200':
          description: All sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    post:
      summary: Create a session (state=new; pair it separately)
      operationId: createSession
      tags: [sessions]
      security: [{bearerAuth: []}, {basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: {type: string}
                phone: {type: string, description: 'International format, e.g. +62 812-0000-0000'}
                is_master: {type: boolean, description: 'Optional; flags the new session as a master immediately instead of a separate PUT .../master call. Defaults to false.'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Validation error (empty name / bad phone).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: One session + recent event ring
      operationId: getSession
      tags: [sessions]
      security: [{bearerAuth: []}, {basicAuth: []}]
      responses:
        '200':
          description: Snapshot with last_events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    properties:
                      last_events:
                        type: array
                        items:
                          type: object
                          properties:
                            at: {type: string, format: date-time}
                            note: {type: string}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      summary: Delete session (unlinks the device and purges all rows)
      operationId: deleteSession
      tags: [sessions]
      security: [{bearerAuth: []}, {basicAuth: []}]
      responses:
        '204': {description: Deleted.}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/activate:
    post:
      summary: Reconnect a paired session (records desired state active)
      operationId: activateSession
      tags: [sessions]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Snapshot after the toggle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Not paired yet, or device record gone (re-pair).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/deactivate:
    post:
      summary: Drop the socket, keep credentials
      operationId: deactivateSession
      tags: [sessions]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Snapshot after the toggle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Not paired yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/master:
    put:
      summary: Flag or unflag a session as a master (routing-exclusion) sender
      description: >
        WSM-native routing state, not a backend capability — works
        identically on whatsmeow and waxum, unlike the operations/ endpoints
        below which 501 on whatsmeow. A master session stays fully
        connected and directly sendable
        (POST /api/v1/sessions/{id}/messages); the flag only removes it from
        AUTOMATIC selection (POST /api/v1/messages,
        /api/v1/messages/group, /api/v1/messages/media,
        /api/v1/contacts/check) unless the caller opts in with
        allow_master on that request. Master exclusion applies WITHIN a
        routing scope: see group_code on those same endpoints and
        PUT /api/v1/sessions/{id}/group-code — a master in a group is the one
        a group_code + master_only request selects.
      operationId: setSessionMaster
      tags: [sessions]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [is_master], properties: {is_master: {type: boolean}}}
      responses:
        '200':
          description: Snapshot after the toggle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400':
          description: Malformed JSON body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/group-code:
    put:
      summary: Assign or clear a session's routing group_code scope
      description: >
        WSM-native routing state, not a backend capability — works
        identically on whatsmeow and waxum, same as
        PUT /api/v1/sessions/{id}/master above. A grouped session stays
        fully connected and directly sendable
        (POST /api/v1/sessions/{id}/messages); the code only scopes
        AUTOMATIC selection to sessions carrying the same group_code — see
        wa.EligibleForRoute. An empty string clears it back to the
        ungrouped pool.
      operationId: setSessionGroupCode
      tags: [sessions]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [group_code], properties: {group_code: {type: string, description: 'Lowercase letters, digits, "-", "_", max 32 chars; "" clears it'}}}
      responses:
        '200':
          description: Snapshot after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400':
          description: Malformed JSON body, or an invalid group_code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/pairing:
    get:
      summary: Live pairing snapshot (raw QR payload for machine clients)
      operationId: getPairing
      tags: [sessions]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Pairing state; done=true with empty error means linked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: {type: string, enum: [qr, phone]}
                  gen: {type: integer, description: 'QR rotation counter'}
                  has_code: {type: boolean}
                  qr: {type: string, description: 'Raw pairing payload to render as QR'}
                  phone_code: {type: string, description: 'XXXX-XXXX pair code (mode=phone)'}
                  seconds_left: {type: integer}
                  done: {type: boolean}
                  error: {type: string}
        '404':
          description: Unknown session, or session is not pairing.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/messages:
    post:
      summary: Send a plain-text message using automatic session routing
      operationId: sendMessageAuto
      tags: [messages]
      security: [{bearerAuth: []}, {basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                to: {type: string, description: 'International format, e.g. +62 812-0000-0000'}
                text: {type: string, maxLength: 4096, description: 'Plain text; line breaks preserved'}
                client_ref: {type: string, description: 'Optional laundry client uid; surfaces in the message log per-client breakdown'}
                tenant_ref: {type: string, description: 'Optional laundry tenant/outlet uid; surfaces in the per-tenant breakdown'}
                category: {type: string, enum: [otp, notification, alert, manual], description: 'Optional; defaults to notification (group defaults to alert)'}
                group_code: {type: string, maxLength: 32, pattern: '^[a-z0-9_-]*$', description: 'Automatic routing only. Narrows selection to sessions carrying this SAME group_code; omitted or "" selects among sessions with NO group code. The match is exact in both directions, so a session with a group code is invisible to a request without one. There is no fallback between scopes: a group whose sessions are all offline answers 409 even while other sessions are connected. Combines with master_only to mean that group''s master.'}
                allow_master: {type: boolean, description: 'Automatic routing only; ignored when a session id is in the path. Opts into a master-flagged session for this one request.'}
                master_only: {type: boolean, description: 'Automatic routing only. Pins this send to the MASTER session and answers 409 when the master is offline - it never falls back to another session. Overrides allow_master, which only WIDENS selection and can never pin. Intended for traffic that must always leave from one known handset, e.g. ops alerts. This mode has no redundancy, so a caller relying on it must monitor the connectivity of the master session itself.'}
      responses:
        '200':
          description: Terminal outcome within 15s; includes selected session metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '202':
          description: Still queued after 15s; includes selected session metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '400':
          description: Validation (text required <=4096; phone rules).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >
            No connected session exists to auto-route through, IN THE SCOPE THE
            REQUEST ASKED FOR. The body names the actual cause rather than the
            symptom, because a scoped send can fail while the gateway is
            perfectly healthy: if the only connected session(s) are flagged
            is_master it says so (see PUT /api/v1/sessions/{id}/master) and
            suggests allow_master; with a group_code it distinguishes "nothing
            carries that code" (likely a typo) from "that group is offline
            while other sessions are connected" from "the group is up but has
            no master". Every group-scoped body ends with the same escape
            hatch - omit group_code to route through any connected session.
            Note GET /api/v1/health counts sessions across ALL scopes, so
            connected > 0 and a 409 here are not a contradiction.
            Note GET /api/v1/health and Manager.Counts() still count a master
            session as connected, so an operator can legitimately see
            connected: 1 here and still get this 409.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Selected session queue full.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/messages/group:
    post:
      summary: Send a plain-text message to a WhatsApp GROUP (automatic session routing)
      description: |
        Same status vocabulary as POST /api/v1/messages, deliberately: the alerter
        chooses between the two at runtime and must not learn two error dialects.
        The device must already be a member of the group. Discover group_jid with
        GET /api/v1/sessions/{id}/groups — a group JID is not guessable and is not
        shown anywhere in the WhatsApp UI.
      operationId: sendGroupMessage
      tags: [messages]
      security: [{bearerAuth: []}, {basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_jid, text]
              properties:
                group_jid: {type: string, description: 'Group JID, e.g. 120363021234567890@g.us (the bare id is accepted). NOTE: unrelated to group_code below — group_jid is a WhatsApp CHAT, group_code is a WSM ROUTING SCOPE. This is the one body where both words appear.'}
                text: {type: string, maxLength: 4096, description: 'Plain text; line breaks preserved'}
                client_ref: {type: string, description: 'Optional laundry client uid; surfaces in the message log per-client breakdown'}
                tenant_ref: {type: string, description: 'Optional laundry tenant/outlet uid; surfaces in the per-tenant breakdown'}
                category: {type: string, enum: [otp, notification, alert, manual], description: 'Optional; defaults to notification (group defaults to alert)'}
                group_code: {type: string, maxLength: 32, pattern: '^[a-z0-9_-]*$', description: 'Automatic routing only. Narrows selection to sessions carrying this SAME group_code; omitted or "" selects among sessions with NO group code. The match is exact in both directions, so a session with a group code is invisible to a request without one. There is no fallback between scopes. Combines with master_only to mean that group''s master. Unrelated to group_jid above.'}
                allow_master: {type: boolean, description: 'Automatic routing only; ignored when a session id is in the path. Opts into a master-flagged session for this one request.'}
                master_only: {type: boolean, description: 'Automatic routing only. Pins this send to the MASTER session and answers 409 when the master is offline - it never falls back to another session. Overrides allow_master, which only WIDENS selection and can never pin. Intended for traffic that must always leave from one known handset, e.g. ops alerts. This mode has no redundancy, so a caller relying on it must monitor the connectivity of the master session itself.'}
      responses:
        '200':
          description: Terminal outcome within 15s; includes selected session metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '202':
          description: Still queued after 15s; includes selected session metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '400':
          description: |
            Validation. Notably a USER JID (...@s.whatsapp.net) is refused here
            rather than delivered to a private chat and reported as sent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >
            No connected session exists to auto-route through, IN THE SCOPE THE
            REQUEST ASKED FOR. The body names the actual cause rather than the
            symptom, because a scoped send can fail while the gateway is
            perfectly healthy: if the only connected session(s) are flagged
            is_master it says so (see PUT /api/v1/sessions/{id}/master) and
            suggests allow_master; with a group_code it distinguishes "nothing
            carries that code" (likely a typo) from "that group is offline
            while other sessions are connected" from "the group is up but has
            no master". Every group-scoped body ends with the same escape
            hatch - omit group_code to route through any connected session.
            Note GET /api/v1/health counts sessions across ALL scopes, so
            connected > 0 and a 409 here are not a contradiction.
            Note GET /api/v1/health and Manager.Counts() still count a master
            session as connected, so an operator can legitimately see
            connected: 1 here and still get this 409.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Send queue full for the selected session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/v1/sessions/{id}/groups:
    get:
      summary: List the groups this device belongs to
      description: How WA_ALERT_GROUP_JID is discovered for the alerting path.
      operationId: listSessionGroups
      tags: [messages]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Groups the paired device is a member of.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    jid: {type: string, example: '120363021234567890@g.us'}
                    name: {type: string, example: 'Clino Ops Alerts'}
                    participants: {type: integer, example: 4}
        '404':
          description: Session not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Session not connected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/v1/sessions/{id}/messages:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Send a plain-text message through this session
      operationId: sendMessage
      tags: [messages]
      security: [{bearerAuth: []}, {basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                to: {type: string, description: 'International format, e.g. +62 812-0000-0000'}
                text: {type: string, maxLength: 4096, description: 'Plain text; line breaks preserved'}
                client_ref: {type: string, description: 'Optional laundry client uid; surfaces in the message log per-client breakdown'}
                tenant_ref: {type: string, description: 'Optional laundry tenant/outlet uid; surfaces in the per-tenant breakdown'}
                category: {type: string, enum: [otp, notification, alert, manual], description: 'Optional; defaults to notification (group defaults to alert)'}
      responses:
        '200':
          description: Terminal outcome within 15s; status is sent or failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '202':
          description: Still queued after 15s; poll GET .../messages.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '400':
          description: Validation (text required <=4096; phone rules).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Session not connected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Send queue full (backpressure; retry later).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      summary: Recent message audit log for this session
      operationId: listMessages
      tags: [messages]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 500}}
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/v1/sessions/{id}/messages/group:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Send a plain-text message to a WhatsApp GROUP through this session (explicit)
      description: |
        The explicit-session counterpart of POST /api/v1/messages/group: the session in the path
        sends, and group_code / master_only / allow_master are ignored, so the message can never
        leave from another handset. The session's device must already be a member of the group
        (discover group_jid with GET /api/v1/sessions/{id}/groups). Same status vocabulary as every
        other send route; `routing` is reported as "explicit".
      operationId: sendGroupMessageViaSession
      tags: [messages]
      security: [{bearerAuth: []}, {basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_jid, text]
              properties:
                group_jid: {type: string, description: 'Group JID, e.g. 120363021234567890@g.us (the bare id is accepted).'}
                text: {type: string, maxLength: 4096, description: 'Plain text; line breaks preserved'}
                client_ref: {type: string, description: 'Optional client uid for the message log'}
                tenant_ref: {type: string, description: 'Optional tenant uid for the message log'}
                category: {type: string, enum: [otp, notification, alert, manual], description: 'Optional; group sends default to alert'}
      responses:
        '200':
          description: Terminal outcome within 15s; status is sent or failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '202':
          description: Still queued after 15s.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '400':
          description: Validation (text required <=4096; group_jid must be a group JID).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Session not connected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/sessions/{id}/messages/media:
    post:
      summary: Send a media message (image, video, audio or document) through this session
      operationId: sendSessionMedia
      tags: [media]
      security: [{bearerAuth: []}, {basicAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind, to]
              properties:
                file: {type: string, format: binary}
                kind: {type: string, enum: [image, video, audio, document]}
                to: {type: string, description: 'International format, e.g. +62 812-0000-0000'}
                caption: {type: string}
                ptt: {type: boolean, description: 'Send audio as a push-to-talk voice note'}
                client_ref: {type: string}
                tenant_ref: {type: string}
                category: {type: string, enum: [otp, notification, alert, manual]}
                allow_master: {type: boolean, description: 'A MULTIPART FORM FIELD, not a JSON key — this endpoint has no JSON body. Automatic routing only; ignored on this explicit-session route (a session id is already in the path).'}
      responses:
        '200':
          description: Terminal outcome within 15s.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaSendResponse'}
        '202':
          description: Still queued after 15s.
          content:
            application/json:
