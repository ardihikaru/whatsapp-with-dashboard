      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaDescriptor'}
      responses:
        '200':
          description: Decrypted bytes, base64-encoded (never raw octet-stream — see the handler's own doc comment).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaDownloadResponse'}
        '400':
          description: Invalid kind or JSON body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Backend has no media store (e.g. whatsmeow).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

