        '404':
          description: Unknown session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: Upload exceeds the configured size limit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '415':
          description: Uploaded bytes do not sniff as the declared kind.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
